name: Azure Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/azure-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/contact/package-lock.json

      - name: Install
        run: npm ci
        working-directory: functions/contact

      - name: Build
        run: npm run build
        working-directory: functions/contact

      - name: Zip
        run: cd functions/contact && zip -r ../../function.zip dist package.json package-lock.json host.json .funcignore

      - name: Azure login and deploy
        run: |
          CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['clientId'])")
          CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['clientSecret'])")
          TENANT_ID=$(echo "$AZURE_CREDENTIALS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tenantId'])")
          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
          az functionapp deployment source config-zip --name aurion-contact --resource-group aurion-site --src function.zip
