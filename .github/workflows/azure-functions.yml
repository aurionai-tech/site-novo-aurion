name: Azure Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/azure-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Echo
        run: echo "ok"
