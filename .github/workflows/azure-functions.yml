name: Azure Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/azure-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm ci
        working-directory: functions/contact

      - name: Build
        run: npm run build
        working-directory: functions/contact

      - name: Echo
        run: echo "done"
